name: Build and Publish

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - 'gdal4k-runtime/**'
      - 'gdal-bundler/**'
      - 'sample-cli/**'
      - 'sample-app/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'buildSrc/**'
      - 'gdal4k-runtime/**'
      - 'gdal-bundler/**'
      - 'sample-cli/**'
      - 'sample-app/**'
  workflow_dispatch:
    inputs:
      gdal_version:
        description: 'GDAL version to build and publish'
        required: false
        type: string
        default: '3.9.0'
      publish:
        description: 'Also publish the GitHub Packages artifacts'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gdal4k-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-binary:
    name: Build ${{ matrix.classifier }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      GDAL_VERSION: ${{ inputs.gdal_version || '3.9.0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-amd64
            runner: ubuntu-24.04
            python-version: '3.12'
            allow-failure: false
          - classifier: linux-arm64
            runner: ubuntu-24.04-arm
            python-version: '3.12'
            allow-failure: false
          - classifier: macos-arm64
            runner: macos-latest
            python-version: '3.12'
            allow-failure: false
          - classifier: windows-amd64
            runner: windows-latest
            python-version: '3.12'
            allow-failure: false
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build GDAL bundle
        if: matrix.runner != 'windows-latest'
        run: >
          ./gradlew --no-daemon --no-watch-fs --console=plain -q --warning-mode=none
          -PgdalVersion=${{ env.GDAL_VERSION }}
          :gdal4k-binary:buildAndBundleGdal

      - name: Install Conda
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: .\gradlew.bat --no-daemon --no-watch-fs --console=plain -q --warning-mode=none :gdal4k-binary:installConda

      - name: Install GDAL deps
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: .\gdal-bundler\scripts\install_gdal_deps_windows.ps1 -CondaPrefix .\gdal-bundler\build\conda -CondaExe .\gdal-bundler\build\conda\Scripts\conda.exe

      - name: Build GDAL bundle (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: >
          .\gradlew.bat --no-daemon --no-watch-fs --console=plain -q --warning-mode=none
          "-PgdalVersion=${{ env.GDAL_VERSION }}"
          -PskipCondaDepsInstall=true
          :gdal4k-binary:buildAndBundleGdal

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdal-bundle-${{ matrix.classifier }}
          path: gdal-bundler/build/gdal-bundle/${{ matrix.classifier }}/gdal/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish local Maven repo
        if: matrix.runner != 'windows-latest'
        run: >
          ./gradlew --no-daemon --no-watch-fs --console=plain -q --warning-mode=none
          -PgdalVersion=${{ env.GDAL_VERSION }}
          -PskipNativeBundleBuild=true
          :gdal4k-runtime:publishToMavenLocal
          :gdal4k-binary:publishToMavenLocal

      - name: Stage local Maven repo
        if: matrix.runner != 'windows-latest'
        run: |
          set -euo pipefail
          mkdir -p build/local-maven-repo/dev
          rm -rf build/local-maven-repo/dev/gdal4k
          cp -R "$HOME/.m2/repository/dev/gdal4k" build/local-maven-repo/dev/

      - name: Publish local Maven repo (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --no-watch-fs --console=plain -q --warning-mode=none `
            "-PgdalVersion=${{ env.GDAL_VERSION }}" `
            -PskipNativeBundleBuild=true `
            :gdal4k-runtime:publishToMavenLocal `
            :gdal4k-binary:publishToMavenLocal

          New-Item -ItemType Directory -Force build\local-maven-repo\dev | Out-Null
          if (Test-Path build\local-maven-repo\dev\gdal4k) {
            Remove-Item -Recurse -Force build\local-maven-repo\dev\gdal4k
          }
          Copy-Item -Recurse "$env:USERPROFILE\.m2\repository\dev\gdal4k" "build\local-maven-repo\dev\"

      - name: Upload local Maven repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdal-local-maven-${{ matrix.classifier }}
          path: build/local-maven-repo/**
          if-no-files-found: error
          retention-days: 7

  publish-github-packages:
    name: Publish GitHub Packages
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs:
      - build-binary
      - test-sample-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      GDAL_VERSION: ${{ inputs.gdal_version || '3.9.0' }}
      GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Download Linux amd64 bundle
        uses: actions/download-artifact@v4
        with:
          name: gdal-bundle-linux-amd64
          path: gdal-bundler/build/gdal-bundle/linux-amd64/gdal

      - name: Download Linux arm64 bundle
        uses: actions/download-artifact@v4
        with:
          name: gdal-bundle-linux-arm64
          path: gdal-bundler/build/gdal-bundle/linux-arm64/gdal

      - name: Download macOS arm64 bundle
        uses: actions/download-artifact@v4
        with:
          name: gdal-bundle-macos-arm64
          path: gdal-bundler/build/gdal-bundle/macos-arm64/gdal

      - name: Download Windows amd64 bundle
        uses: actions/download-artifact@v4
        with:
          name: gdal-bundle-windows-amd64
          path: gdal-bundler/build/gdal-bundle/windows-amd64/gdal

      - name: Publish runtime and binary packages
        run: >
          ./gradlew --no-daemon --no-watch-fs --console=plain -q --warning-mode=none
          -PgdalVersion=${{ env.GDAL_VERSION }}
          -PskipNativeBundleBuild=true
          -PpublishAllPlatformBundles=true
          :gdal4k-runtime:publish
          :gdal4k-binary:publish

  test-sample-cli:
    name: Test sample-cli ${{ matrix.classifier }}
    needs:
      - build-binary
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-amd64
            runner: ubuntu-24.04
          - classifier: linux-arm64
            runner: ubuntu-24.04-arm
          - classifier: macos-arm64
            runner: macos-latest
          - classifier: windows-amd64
            runner: windows-latest
    permissions:
      contents: read
    env:
      GDAL_VERSION: ${{ inputs.gdal_version || '3.9.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Download local Maven repo
        uses: actions/download-artifact@v4
        with:
          name: gdal-local-maven-${{ matrix.classifier }}
          path: local-maven-repo

      - name: Build sample-cli distribution
        if: runner.os != 'Windows'
        working-directory: sample-cli
        run: >
          ./gradlew --no-daemon --no-watch-fs --console=plain -q --warning-mode=none
          -PgdalVersion=${{ env.GDAL_VERSION }}
          -Pgdal4kPackagesUrl=file://${GITHUB_WORKSPACE}/local-maven-repo
          packageDistribution

      - name: Build sample-cli distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $repoUrl = [System.Uri]::new((Join-Path $env:GITHUB_WORKSPACE 'local-maven-repo')).AbsoluteUri
          Set-Location sample-cli
          .\gradlew.bat --no-daemon --no-watch-fs --console=plain -q --warning-mode=none `
            "-PgdalVersion=${{ env.GDAL_VERSION }}" `
            "-Pgdal4kPackagesUrl=$repoUrl" `
            packageDistribution

      - name: Smoke test installed sample-cli
        if: runner.os != 'Windows'
        working-directory: sample-cli
        run: |
          set -euo pipefail
          package="$(find build/distributions -maxdepth 1 \( -name '*.pkg' -o -name '*.deb' \) | sort | head -n 1)"
          if [[ -z "$package" ]]; then
            echo "No installer package found in build/distributions" >&2
            exit 1
          fi

          if [[ "$package" == *.pkg ]]; then
            sudo installer -pkg "$package" -target /
          else
            sudo dpkg -i "$package"
          fi

          sample-cli smoke

      - name: Smoke test installed sample-cli
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location sample-cli
          $package = Get-ChildItem build\distributions -Filter *.msi | Select-Object -First 1
          if (-not $package) {
            throw "No MSI package found in build\distributions"
          }

          Start-Process msiexec.exe -Wait -ArgumentList '/i', $package.FullName, '/qn', '/norestart'

          $cli = Get-ChildItem 'C:\Program Files' -Recurse -Filter sample-cli.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $cli) {
            throw "sample-cli.exe was not found after MSI installation"
          }

          & $cli.FullName smoke

      - name: Upload sample-cli artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-cli-${{ matrix.classifier }}
          path: sample-cli/build/distributions/*
          if-no-files-found: error
          retention-days: 7
