name: GDAL library integration tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/verification/build/vcpkg-cache,readwrite

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linuxX64, os: ubuntu-24.04 }
          - { target: linuxArm64, os: ubuntu-24.04 }
          - { target: macosArm64, os: macos-15 }
          - { target: macosX64, os: macos-15-intel }
          - { target: mingwX64, os: windows-2025 }
          - { target: iosArm64, os: macos-15 }
          - { target: iosSimulatorArm64, os: macos-15 }
          - { target: iosX64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: python -m pip install -r verification/requirements.txt
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: verification/build/vcpkg-cache
          key: engine-${{ matrix.target }}-${{ hashFiles('gdal4k-binary/ports/**', 'gdal4k-binary/engine/**', 'gdal4k-binary/tools/toolchains.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            engine-${{ matrix.target }}-${{ hashFiles('gdal4k-binary/ports/**', 'gdal4k-binary/engine/**', 'gdal4k-binary/tools/toolchains.py') }}-
            engine-${{ matrix.target }}-
      - name: Boot iOS simulator
        timeout-minutes: 5
        if: matrix.target == 'iosSimulatorArm64' || matrix.target == 'iosX64'
        run: |
          device="$(xcrun simctl list devices available --json | python -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for g in d["devices"].values() for x in g if x["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device" || xcrun simctl list devices booted | grep "$device"
          xcrun simctl bootstatus "$device" -b
          echo "IOS_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Test library and independent published consumer
        run: python verification/ci.py '${{ matrix.target }}' ${IOS_DEVICE:+--ios-device "$IOS_DEVICE"}
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: verification/build/staged/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.target }}
          path: |
            gdal4k/build/test-results/
            gdal4k/build/reports/tests/
            verification/results/published-consumer-*/
            verification/tools/vcpkg/buildtrees/*/*.log
            gdal4k-binary/build/engine/*/cmake/build.ninja
            gdal4k-binary/build/engine/*/cmake/CMakeCache.txt
            gdal4k-binary/build/engine/*/cmake/gdal4k-static-dependencies.txt
            gdal4k-binary/build/engine/*/manifest.json
          if-no-files-found: warn

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: python -m pip install -r verification/requirements.txt
      - name: Pinned Emscripten SDK
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git verification/tools/emsdk
          test "$(git -C verification/tools/emsdk rev-parse HEAD)" = c0bb220cb6e6f4e0fabb6f6db9efd53390ef5e56
          verification/tools/emsdk/emsdk install 4.0.23
          verification/tools/emsdk/emsdk activate 4.0.23
      - uses: actions/cache/restore@v6
        id: web-cache
        with:
          path: verification/build/vcpkg-cache
          key: engine-web-${{ hashFiles('gdal4k-binary/ports/**', 'gdal4k-binary/engine/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            engine-web-${{ hashFiles('gdal4k-binary/ports/**', 'gdal4k-binary/engine/**') }}-
            engine-web-
      - name: Browser test runtime
        run: |
          npm ci --prefix verification
          cd verification
          npx playwright install --with-deps chromium
          # Ubuntu's AppArmor policy blocks the user-namespace sandbox for this downloaded browser.
          # Limit the override to this disposable test runner, including independent consumers.
          chrome="$(node -p 'require("playwright").chromium.executablePath()')"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/gdal4k-chrome"
          chmod +x "$RUNNER_TEMP/gdal4k-chrome"
          echo "CHROME_BIN=$RUNNER_TEMP/gdal4k-chrome" >> "$GITHUB_ENV"
      - name: Same own engine in JS and wasmJs, Node and Chromium
        run: |
          source verification/tools/emsdk/emsdk_env.sh
          python verification/ci.py web
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.web-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-web
          path: verification/build/staged/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-web
          path: |
            gdal4k/build/test-results/
            verification/results/published-consumer-*/
            verification/tools/vcpkg/buildtrees/*/*.log

  android:
    name: Android ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - run: python -m pip install -r verification/requirements.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android NDK r28c
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'; then break; fi
            test "$attempt" != 3 || exit 1
            rm -rf "$ANDROID_HOME/.temp"
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: android-cache
        with:
          path: verification/build/vcpkg-cache
          key: engine-android-${{ matrix.abi }}-${{ hashFiles('gdal4k-binary/ports/**', 'gdal4k-binary/engine/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            engine-android-${{ matrix.abi }}-${{ hashFiles('gdal4k-binary/ports/**', 'gdal4k-binary/engine/**') }}-
            engine-android-${{ matrix.abi }}-
      - run: python verification/ci.py 'android-${{ matrix.abi }}'
      - name: Allow emulator acceleration
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: matrix.abi == 'x86_64'
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: python gdal4k/tools/run-android-tests.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_NDK_HOME" --serial emulator-5554 --abi x86_64
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: verification/build/vcpkg-cache
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-android-${{ matrix.abi }}
          path: verification/build/staged/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-android-${{ matrix.abi }}
          path: |
            gdal4k/build/outputs/androidTest-results/
            gdal4k/build/results/
            verification/results/published-consumer-*/
            verification/tools/vcpkg/buildtrees/*/*.log

  assemble:
    needs: [native, web, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - uses: actions/download-artifact@v4
        with: { pattern: 'engine-*', path: verification/build/downloads, merge-multiple: true }
      - name: Restore verified outputs only
        run: python -c 'import tarfile; from pathlib import Path; [tarfile.open(p).extractall(filter="data") for p in Path("verification/build/downloads").glob("*.tar.gz")]'
      - name: Assemble complete Maven repository and verify universal JVM and Android AAR
        run: python verification/ci.py aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: gdal4k-maven
          path: verification/build/staged/complete-maven.tar.gz
          if-no-files-found: error

  linux-arm64-runtime:
    needs: [native, assemble]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.14' }
      - uses: actions/download-artifact@v4
        with: { name: engine-linuxArm64, path: verification/build/downloads }
      - uses: actions/download-artifact@v4
        with: { name: gdal4k-maven, path: verification/build/downloads }
      - run: python -c 'import tarfile; from pathlib import Path; [tarfile.open(p).extractall(filter="data") for p in Path("verification/build/downloads").glob("*.tar.gz")]'
      - run: python verification/ci.py linuxArm64-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-linux-arm64-runtime
          path: verification/results/published-consumer-jvm/
