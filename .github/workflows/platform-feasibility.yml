name: GDAL platform feasibility

on:
  push:
    branches: ['codex/multiplatform-feasibility']
    paths: ['verification/**', '.github/workflows/platform-feasibility.yml']
  pull_request:
    paths: ['verification/**', '.github/workflows/platform-feasibility.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-probe-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: verification
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Gradle before native source build
        run: ./gradlew --version
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Identify iOS SDK
        id: sdk
        run: echo "version=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: ios-cache
        with:
          path: verification/build/vcpkg-binary-cache
          key: ios-gdal-arm64-3cd21e48a75f67acfef289da52893ce79144aaa1-${{ steps.sdk.outputs.version }}
      - name: Pinned iOS GDAL source build
        id: ios-gdal
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/verification/build/vcpkg-binary-cache
        run: |
          mkdir -p tools build/vcpkg-binary-cache
          git init tools/vcpkg
          git -C tools/vcpkg fetch --depth 1 https://github.com/microsoft/vcpkg.git 3cd21e48a75f67acfef289da52893ce79144aaa1
          git -C tools/vcpkg checkout --detach FETCH_HEAD
          tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          VCPKG_MAX_CONCURRENCY=3 tools/vcpkg/vcpkg install 'gdal[core]:arm64-ios-simulator-release' --classic --disable-metrics
      - uses: actions/cache/save@v6
        if: steps.ios-cache.outputs.cache-hit != 'true'
        with:
          path: verification/build/vcpkg-binary-cache
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - name: Build GDAL C bridge for iOS simulator
        run: |
          cmake -S native -B build/ios-simulator -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/tools/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-ios-simulator-release \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ios-simulator --parallel 3
          codesign --force --sign - build/ios-simulator/libgdal4k_probe.dylib
      - name: Run actual Kotlin Native GDAL test on iOS simulator
        run: |
          mkdir -p results
          device="$(xcrun simctl list devices available --json | python -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          SIMCTL_CHILD_PROJ_DATA="$PWD/tools/vcpkg/installed/arm64-ios-simulator-release/share/proj" \
          ./gradlew --console=plain "-PprobePrefix=$PWD/build/ios-simulator" "-PiosDevice=$device" iosSimulatorArm64Test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdal-probe-ios-simulator
          path: |
            verification/build/test-results/
            verification/build/reports/tests/
            verification/tools/vcpkg/buildtrees/gdal/*.log
          if-no-files-found: error
  desktop-and-web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: verification
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Linux GDAL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev ninja-build
      - name: macOS GDAL
        if: runner.os == 'macOS'
        run: brew install gdal ninja
      - name: Windows GDAL and compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gdal mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
          path-type: inherit
      - name: Windows native search paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = '${{ steps.msys2.outputs.msys2-location }}' -replace '\\', '/'
          "$prefix/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CMAKE_PREFIX_PATH=$prefix/mingw64" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROJ_DATA=$prefix/mingw64/share/proj" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GDAL_DATA=$prefix/mingw64/share/gdal" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Python build tools
        run: python -m pip install -r requirements.txt
      - name: Web dependencies
        run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Execute Kotlin JVM, Native, JS and Wasm GDAL probes
        run: python run-local.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdal-probe-${{ matrix.os }}
          path: verification/results/
          if-no-files-found: warn
